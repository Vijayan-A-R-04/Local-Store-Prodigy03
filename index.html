<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Store - E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">🛍 Local Store</div>
    <button class="cart-btn" id="cart-btn" onclick="toggleCart()" aria-label="View Shopping Cart">
      🛒 Cart (<span id="cart-count">0</span>)
    </button>
  </nav>

  <!-- Hero Banner -->
  <header class="hero">
    <h1>Fresh. Local. Delivered.</h1>
    <p>Shop from your favorite local store without leaving home.</p>
  </header>

  <!-- Product Listing -->
  <main>
    <section class="products" id="product-list">
      <!-- Products loaded dynamically -->
    </section>
  </main>

  <!-- Cart Backdrop Overlay -->
  <div id="cart-overlay" class="cart-overlay hidden" onclick="toggleCart()"></div>

  <!-- Cart Sidebar -->
  <aside id="cart-section" class="hidden" aria-label="Shopping Cart">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-cart-btn" onclick="toggleCart()" aria-label="Close Cart">✕</button>
    </div>
    <ul id="cart-items"></ul>
    <div class="cart-footer">
      <p><strong>Total:</strong> ₹<span id="cart-total">0.00</span></p>
      <button id="checkout-btn">Checkout</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
