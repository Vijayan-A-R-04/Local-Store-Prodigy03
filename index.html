<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Store - E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">🛍 Local Store</div>
    <div class="cart" onclick="toggleCart()">
      🛒 Cart <span id="cart-count">0</span>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header class="hero">
    <h1>Fresh. Local. Delivered.</h1>
    <p>Shop from your favorite local store without leaving home.</p>
  </header>

  <!-- Product Listing -->
  <main>
    <section class="products" id="product-list">
      <!-- Products loaded dynamically -->
    </section>
  </main>

  <!-- Cart Sidebar (Initially Hidden) -->
  <aside id="cart-section" class="hidden">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <div class="cart-footer">
      <p><strong>Total:</strong> ₹<span id="cart-total">0.00</span></p>
      <button id="checkout-btn">Checkout</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
